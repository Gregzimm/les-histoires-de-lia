name: Les Histoires de LIA - Publication quotidienne

on:
  schedule:
    # Démarre à 17h30 Paris (15h30 UTC en été)
    # Un sleep aléatoire de 0-60 min dans le pipeline donne une publi entre 17h30 et 18h30
    - cron: '30 15 * * *'
  workflow_dispatch:
    inputs:
      theme:
        description: 'Thème suggéré pour l histoire'
        required: false
        type: string
      skip_publish:
        description: 'Ne pas publier (mode test)'
        required: false
        type: boolean
        default: false

jobs:
  generate-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 70

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Install FFmpeg
        uses: AnimMouse/setup-ffmpeg@v1

      - name: Install Montserrat font
        run: |
          sudo apt-get install -y fonts-montserrat
          fc-cache -fv

      - name: Random delay initial (17h30 to 18h00 Paris)
        run: |
          DELAY=$((RANDOM % 1801))
          echo "Délai initial aléatoire : ${DELAY}s"
          echo "Short publiera entre 17h30 et 18h00, Long entre 17h45 et 18h25"
          sleep $DELAY

      - name: Run pipeline
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_ID: ${{ secrets.ELEVENLABS_VOICE_ID }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          REPLICATE_API_TOKEN: ${{ secrets.REPLICATE_API_TOKEN }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          TIKTOK_ACCESS_TOKEN: ${{ secrets.TIKTOK_ACCESS_TOKEN }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_BUSINESS_ACCOUNT_ID: ${{ secrets.INSTAGRAM_BUSINESS_ACCOUNT_ID }}
        run: |
          ARGS=""
          if [ -n "${{ github.event.inputs.theme }}" ]; then
            ARGS="$ARGS --theme '${{ github.event.inputs.theme }}'"
          fi
          if [ "${{ github.event.inputs.skip_publish }}" = "true" ]; then
            ARGS="$ARGS --no-publish"
          fi
          python main.py $ARGS

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: histoire-${{ github.run_id }}
          path: output/
          retention-days: 3
